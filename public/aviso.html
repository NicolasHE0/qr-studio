<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'" />
  <title>Aviso · QR Studio</title>
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f5f1; color: #1b1a17; margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 20px; }
    main { background: #fff; border: 1px solid #e2dfd6; border-radius: 14px; padding: 28px; max-width: 30rem; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; } p { color: #555; margin: 0 0 8px; } small { color: #888; }
    @media (prefers-color-scheme: dark) { body { background: #121214; color: #f1f0ec; } main { background: #1b1b1f; border-color: #34343b; } p { color: #a2a0a8; } }
  </style>
</head>
<body>
  <main role="main"><h1 id="t">Aviso</h1><p id="b"></p><small>Este aviso lo muestra QR Studio. El responsable del código es quien te lo compartió.</small></main>
  <script src="aviso.js"></script>
</body>
</html>
